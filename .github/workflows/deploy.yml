# Construye la interfaz con Vite y la publica en GitHub Pages en cada push a main.
# En GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Las direcciones de los backends se configuran en
# Settings → Secrets and variables → Actions → Variables:
#   VITE_API_URL, VITE_ANALISIS_URL, VITE_MONITOREO_URL
# Sin ellas, la página publicada usa los datos falsos.
# Ojo: la página es https, así que los backends también tienen que ser https;
# si no, el navegador bloquea las llamadas.

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ANALISIS_URL: ${{ vars.VITE_ANALISIS_URL }}
          VITE_MONITOREO_URL: ${{ vars.VITE_MONITOREO_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v4
